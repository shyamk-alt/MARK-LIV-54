<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width">
<title>JARVIS by Shyam</title>
<style>body{background:black;color:cyan;font-family:monospace;text-align:center;padding-top:80px}
#orb{width:150px;height:150px;margin:0 auto;background:cyan;border-radius:50%;box-shadow:0 0 40px cyan}
button{margin-top:20px;padding:15px 30px;font-size:18px}
</style></head>
<body>
<div id="orb"></div>
<h1>MARK 55 - SHYAM K</h1>
<p id="txt">Tap button below</p>
<button onclick="talk()">🔊 TAP TO TALK</button><br>
<button onclick="listen()">🎤 TAP TO LISTEN</button>

<script>
function talk(){
  let msg = new SpeechSynthesisUtterance("Hello Shyam K Boss! I am Jarvis Mark 55. I am working!");
  msg.lang = "en-US";
  speechSynthesis.speak(msg);
  document.getElementById("txt").innerText = "I SAID: Hello Shyam K Boss!";
}

function listen(){
  let rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  rec.lang = "en-US";
  rec.onstart = ()=>{document.getElementById("txt").innerText="Listening... say time";}
  rec.onresult = (e)=>{
    let said = e.results[0][0].transcript;
    document.getElementById("txt").innerText = "You said: "+said;
    let reply = new SpeechSynthesisUtterance("You said "+said);
    speechSynthesis.speak(reply);
    if(said.toLowerCase().includes("time")){
      let t = new SpeechSynthesisUtterance("Time is "+new Date().toLocaleTimeString());
      speechSynthesis.speak(t);
    }
  }
  rec.start();
}
</script>
</body>
</html>
