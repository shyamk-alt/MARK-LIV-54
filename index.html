<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>MARK LIV 54 - 3D ORB | Shyam K</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:radial-gradient(ellipse at center,#001122 0%,#000 100%);color:#0ff;font-family:monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden;touch-action:none}
.scene{width:200px;height:200px;perspective:800px;margin-top:20px}
.orb-wrap{width:100%;height:100%;transform-style:preserve-3d;transition:transform 0.1s linear}
.orb{width:180px;height:180px;border-radius:50%;background:radial-gradient(circle at 30% 30%, #aaffff, #00ccff 20%, #0066ff 50%, #001a4d 80%, #000);box-shadow:0 0 40px #00aaff,0 0 80px #0066ff,inset -20px -20px 40px rgba(0,0,0,0.8),inset 20px 20px 40px rgba(255,255,255,0.2);position:relative;transform-style:preserve-3d;animation:float 3s ease-in-out infinite}
.orb::before{content:'';position:absolute;top:10%;left:15%;width:40%;height:40%;background:radial-gradient(ellipse,#ffffff88,transparent 70%);border-radius:50%;filter:blur(1px)}
.ring{position:absolute;width:220px;height:220px;top:-20px;left:-20px;border:1px solid rgba(0,255,255,0.2);border-radius:50%;transform-style:preserve-3d}
.r1{transform:rotateX(75deg)}.r2{transform:rotateY(75deg)}.r3{transform:rotateX(0deg) rotateY(0deg);border-style:dashed;animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotateY(360deg)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
h1{margin-top:35px;font-size:34px;letter-spacing:4px;text-shadow:0 0 20px #0ff}
.hint{margin-top:15px;color:#00ffaa;font-size:11px;letter-spacing:2px;animation:blink 1.5s infinite}
@keyframes blink{50%{opacity:0.3}}p{margin-top:8px;color:#666;font-size:10px;letter-spacing:2px}
</style>
</head>
<body>
<div class="scene" id="scene"><div class="orb-wrap" id="orbWrap"><div class="orb"><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div></div></div></div>
<h1>MARK LIV (54)</h1><div class="hint">◀ DRAG TO ROTATE 360° ▶</div>
<p>3D HOLOGRAM ORB | BUILT BY SHYAM K - CHENNAI</p>
<script>
let wrap=document.getElementById('orbWrap'),sx=0,sy=0,rx=-10,ry=20,down=false;
function upd(){wrap.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg)`}
upd();
function start(x,y){down=true;sx=x;sy=y}
function move(x,y){if(!down)return;ry+=(x-sx)*0.8;rx-=(y-sy)*0.8;rx=Math.max(-90,Math.min(90,rx));sx=x;sy=y;upd()}
wrap.addEventListener('touchstart',e=>{start(e.touches[0].clientX,e.touches[0].clientY)},{passive:false});
wrap.addEventListener('touchmove',e=>{e.preventDefault();move(e.touches[0].clientX,e.touches[0].clientY)},{passive:false});
wrap.addEventListener('touchend',()=>down=false);
wrap.addEventListener('mousedown',e=>start(e.clientX,e.clientY));
window.addEventListener('mousemove',e=>move(e.clientX,e.clientY));
window.addEventListener('mouseup',()=>down=false);
let auto=true;setInterval(()=>{if(!down&&auto){ry+=0.5;upd()}},30);
wrap.addEventListener('mouseenter',()=>auto=false);wrap.addEventListener('touchstart',()=>auto=false);
</script>
</body>
</html>
